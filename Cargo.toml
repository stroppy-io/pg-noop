[package]
name = "pg-noop"
version = "0.1.2"
edition = "2021"
description = "NoOp PostgreSQL blackhole server for benchmarking"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stroppy-io/pg-noop"
keywords = ["postgresql", "benchmark", "database", "noop", "blackhole"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "pgnoop"
path = "src/main.rs"

[dependencies]
pgwire = { version = "0.38", default-features = false, features = ["server-api-ring"] }
postgres-types = "0.2"
tikv-jemallocator = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "time"] }
# Shard-per-core needs two things the std library will not give: a listener per
# shard on one port (SO_REUSEPORT) and a thread pinned to a core.
socket2 = { version = "0.6", features = ["all"] }
async-trait = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The io_uring backend and the CPU pinning that shards it are Linux-only, and
# both break the Apple release targets if they are unconditional: the io-uring
# crate needs `MAP_POPULATE`, `MADV_DONTFORK` and the `SYS_io_uring_*` syscalls,
# and `libc::cpu_set_t` / `sched_setaffinity` have no Darwin equivalent. Neither
# can be adapted, so the dependency is scoped to the platform that has it and
# `epoll` carries everywhere else.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
io-uring = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
