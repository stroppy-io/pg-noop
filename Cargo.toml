[package]
name = "db-noop"
version = "0.3.0"
edition = "2021"
# The floor its dependencies set: pgwire 0.38 and smol_str 0.3 both declare
# 1.89, so a build on anything older fails here, in cargo's own words, rather
# than in a container whose image was pinned too low.
rust-version = "1.89"
description = "NoOp PostgreSQL and MySQL/MariaDB server for measuring benchmark clients"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stroppy-io/pg-noop"
keywords = ["postgresql", "mysql", "benchmark", "database", "noop"]
categories = ["database", "command-line-utilities"]

[lib]
name = "db_noop"
path = "src/lib.rs"

# The server, under two names: `dbnoop` is its own, and `pgnoop` is the one every
# script written for the PostgreSQL-only server already uses.
[[bin]]
name = "dbnoop"
path = "src/bin/dbnoop.rs"

[[bin]]
name = "pgnoop"
path = "src/bin/pgnoop.rs"

[dependencies]
tikv-jemallocator = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time"] }
# Shard-per-core needs two things the std library will not give: a listener per
# shard on one port (SO_REUSEPORT) and a thread pinned to a core.
socket2 = { version = "0.6", features = ["all"] }
# errno constants, on every platform. The accept path compares `EMFILE` and
# friends whichever backend is serving, and libc has those on Darwin as well as
# Linux -- only the PINNING call is Linux-only, and that is `cfg`'d in lib.rs.
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The io_uring backend is Linux-only: the crate needs `MAP_POPULATE`,
# `MADV_DONTFORK` and the `SYS_io_uring_*` syscalls, none of which exist on
# Darwin and none of which can be adapted. The dependency and the module are
# scoped to the platform that has it; `epoll` carries everywhere else, which is
# also the runtime fallback for a kernel that will not give up a ring (see
# `resolve_io` in lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[profile.release]
# **A panic is a crash, not a half-dead server.** Unwinding would leave the other
# shards serving a process that has already lost one, which a supervisor cannot see;
# aborting ends it with a nonzero status the moment it happens.
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
